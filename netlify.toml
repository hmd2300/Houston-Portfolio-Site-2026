# The site is generated. `node build/build.mjs` reads /content and /src, checks
# everything, and writes the finished pages to /dist, which is what goes live.
# If the content has a mistake the build stops and the live site is untouched.
[build]
  command = "node build/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Images are content-addressed by filename and never edited in place,
# so they can be cached hard. The HTML must always revalidate.
[[headers]]
  for = "/ASSETS/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # Tell browsers to refuse plain HTTP for a year. Netlify already redirects
    # to HTTPS; this stops the first insecure request from happening at all.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Isolate the browsing context from anything a third party opens.
    Cross-Origin-Opener-Policy = "same-origin"
    # The Content-Security-Policy is written by the build into dist/_headers,
    # one policy for the pages and a separate one for /admin/.
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
